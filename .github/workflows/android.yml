name: Compilar APK

on:
  push:
    branches: [v10-original]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar la app web dentro del APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png android/app/src/main/assets/

      - name: Compilar
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk F26-Escucha-v10.apk

      - uses: actions/upload-artifact@v4
        with:
          name: F26-Escucha-APK
          path: F26-Escucha-v10.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v10
          name: F-26 Escucha v10 (versión de prueba)
          body: "Descarga F26-Escucha.apk e instálala en Android. Lee la interfaz USB en estéreo."
          files: F26-Escucha-v10.apk
          make_latest: false
